# Render Blueprint: deploys the walkthrough as a free static site.
# One-click setup: https://render.com/deploy?repo=https://github.com/eric-hardy-yale/yale_som_virtual
services:
  - type: web
    runtime: static
    name: yale-som-virtual
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
